name: Contract checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mock-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recognition dependencies
        run: python -m pip install -r backend/recognition/requirements.txt
      - name: Install contract test dependencies
        run: python -m pip install -r backend/mock/requirements-test.txt
      - name: Run mock contract tests
        working-directory: backend/mock
        run: python -m unittest test_server.py -v
      - name: Run species data tests
        run: python data/test_species_data.py -v
      - name: Run site data tests
        run: python data/test_sites_data.py -v
      - name: Run recognition baseline tests
        working-directory: backend/recognition
        run: python -m unittest test_recognition.py -v
